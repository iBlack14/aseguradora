services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-falabella_seguros}
      POSTGRES_USER: ${POSTGRES_USER:-falabella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      API_PORT: 4000
      DEMO_MODE: ${DEMO_MODE:-false}
      VERIFIK_TOKEN: ${VERIFIK_TOKEN:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    expose: ["4000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      API_URL: http://api:4000
    expose: ["3000"]
    depends_on:
      api: { condition: service_healthy }
  admin:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      API_URL: http://api:4000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    expose: ["3001"]
    depends_on:
      api: { condition: service_healthy }
  cotizador:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: infrastructure/docker/cotizador.Dockerfile
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    expose: ["3002"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
