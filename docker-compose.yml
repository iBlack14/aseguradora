services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: falabella_seguros
      POSTGRES_USER: falabella
      POSTGRES_PASSWORD: falabella
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falabella -d falabella_seguros"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://falabella:falabella@postgres:5432/falabella_seguros?schema=public
      API_PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
