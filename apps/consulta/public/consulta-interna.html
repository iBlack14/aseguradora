<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta interna de SOAT</title>
<style>body{font:16px Arial,sans-serif;color:#303840;margin:0;padding:24px;background:white}main{max-width:960px;margin:auto}h1{color:#1477a8;font-size:26px}p{line-height:1.6}form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:8px;font-weight:bold}input,button{font:inherit;padding:12px;border-radius:5px;border:1px solid #aab8c0}button{background:#1477a8;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#1477a8}#message{padding:12px 0}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt{font-weight:bold}dd{margin:0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px;border:1px solid #d7e0e5;text-align:left;white-space:nowrap}th{background:#eaf4fa}small{display:block;color:#566570;margin-bottom:24px}@media(max-width:500px){body{padding:16px}dl{grid-template-columns:1fr}form,label,input,button{width:100%;box-sizing:border-box}}</style>
<main><h1>Consulta de certificados SOAT</h1><small>Registro interno de esta plataforma. Esta consulta no acredita una inscripci&oacute;n en APESEG.</small>
<form id="form"><label for="plate">Placa del veh&iacute;culo<input id="plate" required maxlength="9" pattern="[A-Za-z0-9-]{6,9}" placeholder="ABC-123" autocomplete="off"></label><button id="submit">Consultar</button></form>
<p role="status" id="message" aria-live="polite"></p><section id="result" hidden><h2>Resultado</h2><dl id="details"></dl><h2>Historial de certificados registrados</h2><div class="scroll"><table><thead><tr><th>Compa&ntilde;&iacute;a</th><th>P&oacute;liza</th><th>Inicio</th><th>Fin</th><th>Estado</th></tr></thead><tbody id="history"></tbody></table></div></section>
<p>Para consultar certificados de otras plataformas, utiliza la <a href="https://www.apeseg.org.pe/consultas-soat/" target="_blank" rel="noopener noreferrer">consulta oficial de APESEG</a>.</p></main>
<script>
const form=document.querySelector('#form'),message=document.querySelector('#message'),result=document.querySelector('#result'),button=document.querySelector('#submit');
const statusNames={VIGENTE:'Vigente',VENCIDO:'Vencido',ANULADO:'Anulado','A\u00daN_NO_VIGENTE':'Aun no vigente'};
function date(value){return value ? new Intl.DateTimeFormat('es-PE',{timeZone:'America/Lima'}).format(new Date(value.length===10?value+'T12:00:00-05:00':value)):'-'}
function cell(tag,value){const el=document.createElement(tag);el.textContent=value||'-';return el}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;result.hidden=true;message.textContent='Consultando...';document.querySelector('#details').replaceChildren();document.querySelector('#history').replaceChildren();try{const response=await fetch('/api/consulta?'+new URLSearchParams({plate:document.querySelector('#plate').value.trim().toUpperCase()}),{cache:'no-store'});const payload=await response.json();if(!response.ok)throw Error(payload.message||'No se pudo consultar.');const data=payload.data;if(!data.found){message.textContent='No encontramos certificados en el registro interno para esta placa.';return}message.textContent='Certificado encontrado en el registro interno.';for(const [label,value] of [['Placa',data.plate],['Aseguradora',data.insurer],['Certificado',data.policyNumber],['Estado',statusNames[data.status]||data.status],['Inicio',date(data.startsAt)],['Fin',date(data.expiresAt)],['Uso',data.vehicleUse],['Clase',data.vehicleClass],['Tipo',data.certificateType]]){if(value)document.querySelector('#details').append(cell('dt',label),cell('dd',value))}for(const record of data.history||[data]){const tr=document.createElement('tr');for(const value of [record.insurer,record.policyNumber,date(record.startsAt),date(record.expiresAt),statusNames[record.status]||record.status])tr.append(cell('td',value));document.querySelector('#history').append(tr)}result.hidden=false}catch(error){message.textContent=error.message||'Consulta no disponible.'}finally{button.disabled=false}});
</script></html>
